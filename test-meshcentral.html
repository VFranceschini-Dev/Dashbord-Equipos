<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Conexión MeshCentral</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .content {
            padding: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        
        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-secondary:hover {
            background: #e0e0e0;
        }
        
        .status {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .pc-list {
            margin-top: 20px;
        }
        
        .pc-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }
        
        .pc-item.connected {
            border-left-color: #28a745;
        }
        
        .pc-item.disconnected {
            border-left-color: #dc3545;
        }
        
        .pc-name {
            font-weight: 600;
            font-size: 16px;
            color: #333;
            margin-bottom: 5px;
        }
        
        .pc-details {
            font-size: 13px;
            color: #666;
        }
        
        .pc-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 5px;
        }
        
        .pc-status.connected {
            background: #d4edda;
            color: #155724;
        }
        
        .pc-status.disconnected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .search-result {
            background: #fff3cd;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #ffc107;
            margin-top: 20px;
        }
        
        .search-result h3 {
            color: #856404;
            margin-bottom: 10px;
        }
        
        .log {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
        }
        
        .log-entry {
            margin-bottom: 5px;
        }
        
        .log-entry.info {
            color: #4ec9b0;
        }
        
        .log-entry.success {
            color: #6a9955;
        }
        
        .log-entry.error {
            color: #f48771;
        }
        
        .log-entry.warning {
            color: #dcdcaa;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .stat-label {
            font-size: 12px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 Test de Conexión MeshCentral</h1>
            <p>Script para probar la conexión con tu servidor MeshCentral</p>
        </div>
        
        <div class="content">
            <div class="form-group">
                <label>URL del Servidor MeshCentral:</label>
                <input type="text" id="serverUrl" placeholder="https://mesh.donnet.com.ar" value="https://mesh.donnet.com.ar">
            </div>
            
            <div class="form-group">
                <label>Usuario:</label>
                <input type="text" id="username" placeholder="admin">
            </div>
            
            <div class="form-group">
                <label>Contraseña:</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            
            <div class="form-group">
                <label>Nombre de PC a buscar (opcional):</label>
                <input type="text" id="pcSearch" placeholder="Ej: PC-CONTABILIDAD-01">
            </div>
            
            <div>
                <button class="btn btn-primary" id="btnConnect" onclick="testConnection()">
                    🔌 Probar Conexión
                </button>
                <button class="btn btn-secondary" onclick="clearLog()">
                    🗑️ Limpiar Log
                </button>
            </div>
            
            <div id="status"></div>
            
            <div id="stats" class="stats" style="display: none;">
                <div class="stat-card">
                    <div class="stat-value" id="totalPCs">0</div>
                    <div class="stat-label">Total PCs</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #28a745 0%, #20c997 100%);">
                    <div class="stat-value" id="connectedPCs">0</div>
                    <div class="stat-label">Conectadas</div>
                </div>
                <div class="stat-card" style="background: linear-gradient(135deg, #dc3545 0%, #e83e8c 100%);">
                    <div class="stat-value" id="disconnectedPCs">0</div>
                    <div class="stat-label">Desconectadas</div>
                </div>
            </div>
            
            <div id="searchResult"></div>
            
            <div id="pcList" class="pc-list"></div>
            
            <div class="log" id="log"></div>
        </div>
    </div>
    
    <script>
        let ws = null;
        let nodes = [];
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString('es-AR');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = `<div class="status ${type}">${message}</div>`;
        }
        
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        async function testConnection() {
            const serverUrl = document.getElementById('serverUrl').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const pcSearch = document.getElementById('pcSearch').value.trim();
            
            if (!serverUrl || !username || !password) {
                showStatus('❌ Por favor completa todos los campos obligatorios', 'error');
                log('Error: Campos incompletos', 'error');
                return;
            }
            
            const btnConnect = document.getElementById('btnConnect');
            btnConnect.disabled = true;
            btnConnect.textContent = '⏳ Conectando...';
            
            log('Iniciando prueba de conexión...', 'info');
            log(`Servidor: ${serverUrl}`, 'info');
            log(`Usuario: ${username}`, 'info');
            
            try {
                // Convertir URL HTTPS a WSS
                const wsUrl = serverUrl.replace('https://', 'wss://').replace('http://', 'ws://');
                log(`WebSocket URL: ${wsUrl}/meshrelay.ashx`, 'info');
                
                // Crear conexión WebSocket
                ws = new WebSocket(`${wsUrl}/meshrelay.ashx`);
                
                ws.onopen = () => {
                    log('✅ WebSocket conectado', 'success');
                    showStatus('✅ Conectado al servidor. Autenticando...', 'success');
                    
                    // Enviar credenciales
                    const authMessage = {
                        action: 'auth',
                        username: username,
                        password: password
                    };
                    
                    ws.send(JSON.stringify(authMessage));
                    log('Credenciales enviadas', 'info');
                };
                
                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleMessage(data, pcSearch);
                    } catch (e) {
                        log(`Error al parsear mensaje: ${e.message}`, 'error');
                    }
                };
                
                ws.onerror = (error) => {
                    log('❌ Error en la conexión WebSocket', 'error');
                    showStatus('❌ Error de conexión. Verifica la URL del servidor y que el servidor permita conexiones WebSocket.', 'error');
                    btnConnect.disabled = false;
                    btnConnect.textContent = '🔌 Probar Conexión';
                };
                
                ws.onclose = () => {
                    log('🔌 Conexión cerrada', 'warning');
                    btnConnect.disabled = false;
                    btnConnect.textContent = '🔌 Probar Conexión';
                };
                
                // Timeout después de 10 segundos
                setTimeout(() => {
                    if (ws && ws.readyState === WebSocket.CONNECTING) {
                        log('⏱️ Timeout: La conexión tardó demasiado', 'warning');
                        showStatus('⏱️ Timeout: No se pudo conectar en 10 segundos', 'error');
                        ws.close();
                        btnConnect.disabled = false;
                        btnConnect.textContent = '🔌 Probar Conexión';
                    }
                }, 10000);
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
                showStatus(`❌ Error: ${error.message}`, 'error');
                btnConnect.disabled = false;
                btnConnect.textContent = '🔌 Probar Conexión';
            }
        }
        
        function handleMessage(data, pcSearch) {
            log(`Mensaje recibido: ${data.action}`, 'info');
            
            switch (data.action) {
                case 'authComplete':
                    log('✅ Autenticación exitosa', 'success');
                    showStatus('✅ Autenticación exitosa. Solicitando lista de PCs...', 'success');
                    
                    // Solicitar lista de nodos
                    ws.send(JSON.stringify({ action: 'nodes' }));
                    log('Solicitando lista de nodos...', 'info');
                    break;
                
                case 'nodes':
                    log(`📋 Recibidos ${data.nodes.length} nodos`, 'success');
                    nodes = data.nodes;
                    displayNodes(nodes, pcSearch);
                    break;
                
                case 'authError':
                    log('❌ Error de autenticación', 'error');
                    showStatus('❌ Error de autenticación. Verifica usuario y contraseña.', 'error');
                    break;
                
                default:
                    log(`Mensaje no reconocido: ${data.action}`, 'warning');
            }
        }
        
        function displayNodes(nodes, pcSearch) {
            const connected = nodes.filter(n => n.conn === 1 || n.connected);
            const disconnected = nodes.filter(n => n.conn !== 1 && !n.connected);
            
            // Mostrar estadísticas
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('totalPCs').textContent = nodes.length;
            document.getElementById('connectedPCs').textContent = connected.length;
            document.getElementById('disconnectedPCs').textContent = disconnected.length;
            
            showStatus(`✅ Conexión exitosa. Se encontraron ${nodes.length} PCs (${connected.length} conectadas, ${disconnected.length} desconectadas)`, 'success');
            
            // Buscar PC específica
            if (pcSearch) {
                log(`🔍 Buscando PC: "${pcSearch}"`, 'info');
                const foundPC = nodes.find(n => 
                    n.name.toLowerCase().includes(pcSearch.toLowerCase()) ||
                    (n.hostname && n.hostname.toLowerCase().includes(pcSearch.toLowerCase()))
                );
                
                const searchResultDiv = document.getElementById('searchResult');
                if (foundPC) {
                    log(`✅ PC encontrada: ${foundPC.name}`, 'success');
                    searchResultDiv.innerHTML = `
                        <div class="search-result">
                            <h3>✅ PC Encontrada</h3>
                            <div class="pc-name">${foundPC.name}</div>
                            <div class="pc-details">
                                <strong>Hostname:</strong> ${foundPC.hostname || 'N/A'}<br>
                                <strong>IP:</strong> ${foundPC.ip || foundPC.host || 'N/A'}<br>
                                <strong>SO:</strong> ${foundPC.os || foundPC.osdesc || 'N/A'}<br>
                                <strong>Estado:</strong> ${foundPC.conn === 1 || foundPC.connected ? '🟢 Conectada' : '🔴 Desconectada'}<br>
                                <strong>Grupo:</strong> ${foundPC.meshName || foundPC.groupName || 'Sin grupo'}<br>
                                ${foundPC.agentVersion ? `<strong>Versión Agente:</strong> ${foundPC.agentVersion}<br>` : ''}
                                ${foundPC.cpu ? `<strong>CPU:</strong> ${foundPC.cpu}<br>` : ''}
                                ${foundPC.ram ? `<strong>RAM:</strong> ${Math.round(foundPC.ram / 1024)}MB<br>` : ''}
                            </div>
                        </div>
                    `;
                } else {
                    log(`❌ PC no encontrada: "${pcSearch}"`, 'error');
                    searchResultDiv.innerHTML = `
                        <div class="search-result" style="background: #f8d7da; border-left-color: #dc3545;">
                            <h3 style="color: #721c24;">❌ PC No Encontrada</h3>
                            <p>No se encontró ninguna PC con el nombre "${pcSearch}"</p>
                        </div>
                    `;
                }
            }
            
            // Mostrar lista de PCs
            const pcListDiv = document.getElementById('pcList');
            pcListDiv.innerHTML = '<h3 style="margin-top: 20px; margin-bottom: 15px;">📋 Lista de PCs</h3>';
            
            nodes.forEach(node => {
                const isConnected = node.conn === 1 || node.connected;
                const pcItem = document.createElement('div');
                pcItem.className = `pc-item ${isConnected ? 'connected' : 'disconnected'}`;
                pcItem.innerHTML = `
                    <div class="pc-name">${node.name}</div>
                    <div class="pc-details">
                        <strong>Hostname:</strong> ${node.hostname || node.rname || 'N/A'} | 
                        <strong>IP:</strong> ${node.ip || node.host || 'N/A'} | 
                        <strong>SO:</strong> ${node.os || node.osdesc || 'N/A'}
                    </div>
                    <span class="pc-status ${isConnected ? 'connected' : 'disconnected'}">
                        ${isConnected ? '🟢 Conectada' : '🔴 Desconectada'}
                    </span>
                `;
                pcListDiv.appendChild(pcItem);
            });
        }
        
        // Cerrar conexión al cerrar la página
        window.addEventListener('beforeunload', () => {
            if (ws) {
                ws.close();
            }
        });
    </script>
</body>
</html>
