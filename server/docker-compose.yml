services:
  metabase-server:
    build: .
    container_name: dashbord-equipos-metabase-server
    restart: unless-stopped
    ports:
      - "4000:4000"          # expuesto en la red interna; el frontend apunta acá
    env_file:
      - .env                 # API key SOLO dentro del contenedor
    networks:
      - internal
    # El servidor corre en un host de la red interna con acceso a 10.0.0.8:3000.

networks:
  internal:
    driver: bridge
